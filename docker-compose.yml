version: '3.8'
services:
  app:
    build: .
    ports:
      - "800:800"
    environment:
      - PANTRYPRO_MYSQL_URL=jdbc:mysql://db:3306/pantrypro_schema?autoReconnect=true
      - PANTRYPRO_MYSQL_USER=pantrypro
      - PANTRYPRO_MYSQL_PASS=pantrypro_secret
      - PANTRYPRO_SSL_KEYSTORE=chitchatserver.com.jks
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: pantrypro_schema
      MYSQL_USER: pantrypro
      MYSQL_PASSWORD: pantrypro_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./lib/src/main/resources/db/migration:/docker-entrypoint-initdb.d
volumes:
  mysql_data:
